<svg xmlns="http://www.w3.org/2000/svg" width="880" height="96" viewBox="0 0 880 96" role="img" aria-label="Total contributions 2,803; top languages across all repositories">
<style>
  text { font-family: 'Segoe UI', Ubuntu, Helvetica, sans-serif; }
  .num { font-size: 34px; font-weight: 700; fill: #a371f7; }
  .cap { font-size: 10px; font-weight: 600; fill: #c9d1d9; letter-spacing: 1.2px; }
  .sub { font-size: 9px; fill: #8b949e; }
  .lg  { font-size: 11px; fill: #c9d1d9; }
  .pc  { font-size: 11px; font-weight: 600; fill: #8b949e; }
  .ttl { font-size: 10px; font-weight: 600; fill: #8b949e; letter-spacing: 1.2px; }
  .fx  { opacity: 0; animation: rise .55s ease-out forwards; }
  #bar { animation: grow 1s cubic-bezier(.4,0,.2,1) forwards; transform-origin: 250px 0; }
  @keyframes rise { from { opacity:0; transform: translateY(6px); }
                     to { opacity:1; transform: translateY(0); } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
</style>
<rect x="0.5" y="0.5" width="879" height="95" rx="10" fill="#0d1117" stroke="#30363d"/>
<g class="fx">
  <text x="24" y="48" class="num">2,803</text>
  <text x="24" y="66" class="cap">TOTAL CONTRIBUTIONS</text>
  <text x="24" y="80" class="sub">all-time &#183; public + private</text>
</g>
<line x1="228" y1="20" x2="228" y2="76" stroke="#30363d"/>
<text x="250" y="24" class="ttl">LANGUAGES</text>
<clipPath id="r"><rect x="250" y="34" width="606" height="9" rx="4.5"/></clipPath>
<g clip-path="url(#r)" id="bar"><rect x="250.0" y="34" width="181.8" height="9" fill="#b07219"/><rect x="431.8" y="34" width="151.5" height="9" fill="#3572A5"/><rect x="583.3" y="34" width="90.9" height="9" fill="#f34b7d"/><rect x="674.2" y="34" width="90.9" height="9" fill="#3178c6"/><rect x="765.1" y="34" width="60.6" height="9" fill="#e34c26"/><rect x="825.7" y="34" width="30.3" height="9" fill="#8b949e"/></g>
<g class="fx" style="animation-delay:0.30s"><circle cx="254.0" cy="66" r="4" fill="#b07219"/><text x="263.0" y="70" class="lg">Java</text><text x="292.2" y="70" class="pc">30%</text></g><g class="fx" style="animation-delay:0.36s"><circle cx="332.5" cy="66" r="4" fill="#3572A5"/><text x="341.5" y="70" class="lg">Python</text><text x="382.8" y="70" class="pc">25%</text></g><g class="fx" style="animation-delay:0.42s"><circle cx="423.1" cy="66" r="4" fill="#f34b7d"/><text x="432.1" y="70" class="lg">C++</text><text x="455.2" y="70" class="pc">15%</text></g><g class="fx" style="animation-delay:0.48s"><circle cx="495.5" cy="66" r="4" fill="#3178c6"/><text x="504.5" y="70" class="lg">TypeScript</text><text x="570.0" y="70" class="pc">15%</text></g><g class="fx" style="animation-delay:0.54s"><circle cx="610.3" cy="66" r="4" fill="#e34c26"/><text x="619.3" y="70" class="lg">HTML</text><text x="648.5" y="70" class="pc">10%</text></g><g class="fx" style="animation-delay:0.60s"><circle cx="688.8" cy="66" r="4" fill="#8b949e"/><text x="697.8" y="70" class="lg">Other</text><text x="733.0" y="70" class="pc">5%</text></g>
</svg>